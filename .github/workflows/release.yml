name: Release to RubyGems

# Deliberately manual and disabled by default. Publishing requires both an
# explicit confirmation here and a matching pending/trusted publisher for this
# workflow and the `release` environment on RubyGems.org.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in lib/speedy/version.rb
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    if: >-
      inputs.publish == true &&
      vars.RUBYGEMS_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '4.0'
          bundler: '4.0.22'
          bundler-cache: true
      - name: Validate version and package
        run: |
          bundle exec ruby script/check_release_tag.rb "${GITHUB_REF_NAME}"
          bundle exec rake
          bundle exec rbs -r date -I sig validate
          bundle exec ruby script/package_smoke_test.rb
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1
